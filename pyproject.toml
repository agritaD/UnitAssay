[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unitassay"
version = "0.1.0"
description = "Screen, curate and check the drift of spike-sorted units — and say which ones it cannot decide."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Agrita Dubey", email = "agrita.dubey@pennmedicine.upenn.edu" },
    { name = "Qiao (Betty) Xu" },
]
keywords = ["electrophysiology", "spike-sorting", "curation", "neuropixels",
            "quality-metrics", "kilosort"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "h5py>=3.8",
    "click>=8.0",
    "pyyaml>=6.0",
    # REQUIRED, not optional: curate/bimodality.py raises on import without it,
    # so the whole package is unimportable. The dip statistic is one of the two
    # every within-cluster verdict rests on.
    "diptest>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# NO `sort` OR `si` EXTRA ANY MORE (2026-09-08). Both existed only to support
# modules nothing in the package imported: a Kilosort driver and a
# SpikeInterface quality-metric comparison. Running the sorter is a separate
# program's job and Kilosort is GPL-3.0 against this package's MIT; the SI path
# was a comparison for our own paper, not part of the tool. What is left is the
# dependency list above and nothing else.

[project.urls]
Homepage = "https://github.com/agritaD/UnitAssay"

[project.scripts]
unitassay = "unitassay.cli:main"

[tool.setuptools.packages.find]
include = ["unitassay*"]

# The viewer's page is data, not a module: without this a WHEEL ships the server
# and not the page, and `unitassay view` serves a 500. Editable installs hide it.
[tool.setuptools.package-data]
"unitassay.view" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite needs no data and no network. If a test ever does, it does not
# belong in this directory -- a reviewer must be able to run it on a clone.
addopts = "-q"
