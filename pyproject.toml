[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unitassay"
version = "0.1.0"
description = "Measure, curate and link spike-sorted units — and say which ones it cannot decide."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Agrita Dubey", email = "agrita.dubey@pennmedicine.upenn.edu" },
    { name = "Qiao (Betty) Xu" },
]
keywords = ["electrophysiology", "spike-sorting", "curation", "neuropixels",
            "quality-metrics", "kilosort"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "h5py>=3.8",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/agritaD/unitassay"

[project.scripts]
unitassay = "unitassay.cli:main"

[tool.setuptools.packages.find]
include = ["unitassay*"]
