[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unitassay"
version = "0.1.0"
description = "Measure, curate and link spike-sorted units — and say which ones it cannot decide."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Agrita Dubey", email = "agrita.dubey@pennmedicine.upenn.edu" },
    { name = "Qiao (Betty) Xu" },
]
keywords = ["electrophysiology", "spike-sorting", "curation", "neuropixels",
            "quality-metrics", "kilosort"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "h5py>=3.8",
    "click>=8.0",
    "pyyaml>=6.0",
    # REQUIRED, not optional: curate/bimodality.py raises on import without it,
    # so the whole package is unimportable. The dip statistic is one of the two
    # every within-cluster verdict rests on.
    "diptest>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# RUNNING THE SORTER is not part of the post-Kilosort job, so kilosort and torch
# are an extra rather than a dependency: `isolate/sorting/run_kilosort4.py`
# imports them inside the function that needs them and raises with install
# instructions, so the package imports and curates without either.
sort = ["kilosort[gui]==4.0.22", "torch>=2.0"]
# SpikeInterface's quality metrics are a COMPARISON path, not the tool's own.
# `isolate/curation/si_quality_metrics.py` guards its imports and nothing in the
# package imports that module.
si = ["spikeinterface>=0.100", "pandas>=2.0"]

[project.urls]
Homepage = "https://github.com/agritaD/unitassay"

[project.scripts]
unitassay = "unitassay.cli:main"

[tool.setuptools.packages.find]
include = ["unitassay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite needs no data and no network. If a test ever does, it does not
# belong in this directory -- a reviewer must be able to run it on a clone.
addopts = "-q"
